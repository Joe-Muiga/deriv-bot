# render.yaml – Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: sifm-deriv-bot
    runtime: python
    region: oregon    # or frankfurt for EU

    buildCommand: pip install -r requirements.txt
    startCommand: python main.py

    # Render free plan: always-on via our self-ping mechanism
    plan: free

    envVars:
      # ── REQUIRED: add these in Render Dashboard → Environment ──────────
      - key: DERIV_API_TOKEN
        sync: false          # enter manually – never commit to git!

      - key: DERIV_APP_ID
        value: "1089"        # replace with your app ID from api.deriv.com

      # ── Auto-populated by Render ────────────────────────────────────────
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: sifm-deriv-bot
          type: web
          property: host

      # ── Optional tweaks ─────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: INFO

      - key: PORT
        value: "8080"

      # ── Auto-redeploy scheduler ─────────────────────────────────────────
      - key: RENDER_DEPLOY_HOOK_URL
        sync: false          # enter manually – URL contains a secret key!

      # ── REQUIRED for the Donkey RAW/ORIGINAL balance-trend switch to
      # survive redeploys (see strategy_cycle.py's module docstring).
      # Without these two, the bot forgets which variant it's on and
      # restarts trend detection from scratch every redeploy.
      - key: RENDER_API_KEY
        sync: false          # Render Dashboard → Account Settings → API Keys

      - key: RENDER_SERVICE_ID
        sync: false          # the srv-xxxxxxxx id in this service's own Settings-page URL

      # ── Optional strategy-switch tuning ──────────────────────────────────
      - key: STRATEGY_SWITCH_MIN_MINUTES
        value: "60"            # never switch before a variant has run this long

      - key: STRATEGY_SWITCH_MAX_MINUTES
        value: "180"           # force a switch by here even with no clear reversal

      - key: STRATEGY_SWITCH_MIN_GAIN_PCT
        value: "2.0"           # must rise this % above the run's start before a pullback counts

      - key: STRATEGY_SWITCH_DRAWDOWN_PCT
        value: "1.5"           # then a pullback of this % off the peak triggers the switch

      - key: STRATEGY_SWITCH_COOLDOWN_MINUTES
        value: "60"            # minutes disconnected from Deriv once a switch triggers
